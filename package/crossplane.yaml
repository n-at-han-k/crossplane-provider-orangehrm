      ## Getting started

      Install the provider, then give it an endpoint and an OAuth client.
      OrangeHRM needs to be told WHERE it is as well as who you are, and
      its access tokens expire in an hour, so the secret holds the client the
      provider mints tokens with rather than a token:

      ```yaml
      apiVersion: pkg.crossplane.io/v1
      kind: Provider
      metadata:
        name: provider-orangehrm
      spec:
        package: xpkg.upbound.io/n-at-han-k/provider-orangehrm:v0.1.0
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: orangehrm-creds
        namespace: crossplane-system
      type: Opaque
      stringData:
        credentials: |
          {
            "endpoint": "https://hr.example.com/web/index.php",
            "clientId": "crossplane",
            "clientSecret": "...",
            "username": "admin",
            "password": "..."
          }
      ---
      apiVersion: orangehrm.crossplane.io/v1alpha1
      kind: ClusterProviderConfig
      metadata:
        name: default
      spec:
        credentials:
          source: Secret
          secretRef:
            namespace: crossplane-system
            name: orangehrm-creds
            key: credentials
      ```

      Register the client under Admin > Configuration > Register OAuth Client.
      `username`/`password` make it the `password` grant, which is what most of
      this API's rights need; without them it is `client_credentials`. A
      ready-made `token` is accepted too, and nothing renews it.

      See the `examples/` directory in the source repository for a manifest per
      managed resource.
spec:
  # SafeStart, NOT "safe-start". crossplane/provider-template ships the
  # kebab-case spelling, which is not the enum value: Crossplane silently
  # prunes it, the ProviderRevision comes up with no capabilities, and the RBAC
  # manager therefore never grants the CRD get/list/watch that a safe-start
  # provider needs. The binary still runs its crd-gate, which then cannot sync
  # and the container CrashLoopBackOffs with "failed to wait for crd-gate
  # caches to sync".
  capabilities:
    - SafeStart
